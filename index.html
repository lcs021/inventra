/* ---------- Consertos Baiano: gráfico semana / mês ---------- */
const dStr=d=>d.toLocaleDateString('sv-SE'),dObj=s=>new Date(s+'T12:00:00'),addDias=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return dStr(d)};
const segDe=s=>{const d=dObj(s);return addDias(s,-((d.getDay()+6)%7))};
const diaBai=o=>o.data_ref?String(o.data_ref).slice(0,10):dia(o.criado);
const ddmm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const DSEM=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function periodoBai(){const ref=ui.baiRef||hoje();
  if(ui.baiPer==='mes'){const y=+ref.slice(0,4),m=+ref.slice(5,7),ini=ref.slice(0,8)+'01',fim=dStr(new Date(y,m,0,12));
    const grupos=[];for(let s=segDe(ini);s<=fim;s=addDias(s,7)){const a=s<ini?ini:s,b=addDias(s,6)>fim?fim:addDias(s,6);grupos.push({de:a,ate:b,rot:'Sem '+(grupos.length+1),sub:ddmm(a)+'–'+ddmm(b)})}
    return{de:ini,ate:fim,grupos,titulo:MESES_L[m-1][0].toUpperCase()+MESES_L[m-1].slice(1)+' de '+y,nome:'mês',art:'do'}}
  const ini=segDe(ref),fim=addDias(ini,6);
  return{de:ini,ate:fim,grupos:DSEM.map((d,i)=>{const s=addDias(ini,i);return{de:s,ate:s,rot:d,sub:ddmm(s)}}),titulo:'Semana de '+ddmm(ini)+' a '+ddmm(fim)+'/'+fim.slice(0,4),nome:'semana',art:'da'}}
function dadosBai(){const P=periodoBai(),base=ocs.filter(o=>o.categoria==='Consertos Baiano'&&(!ui.pessoa||o.autor===ui.pessoa));
  const regs=base.filter(o=>{const d=diaBai(o);return d>=P.de&&d<=P.ate});
  P.grupos.forEach(g=>{const r=regs.filter(o=>{const d=diaBai(o);return d>=g.de&&d<=g.ate});g.valor=r.reduce((a,o)=>a+(totalBai(o)||0),0);g.pecas=r.reduce((a,o)=>a+(Number(o.qtd)||1),0)});
  P.regs=regs;P.total=regs.reduce((a,o)=>a+(totalBai(o)||0),0);P.pecas=regs.reduce((a,o)=>a+(Number(o.qtd)||1),0);
  P.cortadas=regs.filter(o=>Number(o.valor_conserto)===0).reduce((a,o)=>a+(Number(o.qtd)||1),0);
  P.melhor=P.grupos.reduce((a,g)=>g.valor>(a?a.valor:0)?g:a,null);return P}
function svgBai(P){const W=640,H=230,pl=8,pr=8,pt=26,pb=44,n=P.grupos.length,cw=(W-pl-pr)/n,bw=Math.min(54,cw*.62),mx=Math.max(1,...P.grupos.map(g=>g.valor)),ch=H-pt-pb,hj=hoje();
  const lin=[0,.5,1].map(f=>{const y=pt+ch-ch*f;return`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`}).join('');
  return`<svg class="bsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor dos consertos por ${P.nome==='mês'?'semana':'dia'}">${lin}${P.grupos.map((g,i)=>{const x=pl+cw*i+(cw-bw)/2,h=g.valor?Math.max(3,ch*g.valor/mx):2,y=pt+ch-h,eh=hj>=g.de&&hj<=g.ate;
    return`<g><title>${g.rot} ${g.sub}: ${brl(g.valor)} · ${g.pecas} peça${g.pecas===1?'':'s'}</title><rect class="bar${g.valor?'':' zero'}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="5"/>
    ${g.valor?`<text class="vl" x="${x+bw/2}" y="${y-7}" text-anchor="middle">${brl(g.valor).replace(/\s/g,' ')}</text>`:''}
    <text class="${eh?'hj':''}" x="${x+bw/2}" y="${H-pb+18}" text-anchor="middle">${g.rot}</text><text x="${x+bw/2}" y="${H-pb+33}" text-anchor="middle" style="font-weight:500">${g.sub}</text></g>`}).join('')}</svg>`}
function baiGrafHTML(){const P=dadosBai(),fut=P.ate>=hoje();
  return`<div class="box bgraf" id="bgraf"><div class="top"><div class="seg" role="group" aria-label="Período"><button type="button" data-bper="semana" aria-pressed="${ui.baiPer!=='mes'}">Semana</button><button type="button" data-bper="mes" aria-pressed="${ui.baiPer==='mes'}">Mês</button></div>
  <div class="per"><button type="button" class="nav" data-bnav="-1" aria-label="Período anterior">‹</button><b>${P.titulo}</b><button type="button" class="nav" data-bnav="1" aria-label="Próximo período" ${fut?'disabled':''}>›</button></div></div>
  <div class="kp"><div><b style="color:var(--bai)">${brl(P.total)}</b><span>total ${P.art} ${P.nome}</span></div><div><b>${P.pecas}</b><span>peças consertadas</span></div><div><b>${P.cortadas}</b><span>cortadas (abaixo de R$ 15)</span></div><div><b>${P.melhor?esc(P.melhor.rot):'—'}</b><span>${P.nome==='mês'?'semana':'dia'} com mais valor${P.melhor?' ('+P.melhor.sub+')':''}</span></div></div>
  ${P.regs.length?svgBai(P):`<div class="empty" style="padding:22px">Nenhum conserto ${P.nome==='mês'?'neste mês':'nesta semana'}.</div>`}
  <div class="acts"><button type="button" class="btn sm primary" id="bimpGraf" ${P.regs.length?'':'disabled'}>🖨 Imprimir relatório ${P.art} ${P.nome}</button><button type="button" class="btn sm" id="bxls" ${P.regs.length?'':'disabled'}>⬇ Excel ${P.art} ${P.nome}</button>${ui.baiRef&&ui.baiRef!==hoje()?'<button type="button" class="btn sm" id="bhoje">Voltar para hoje</button>':''}</div></div>`}
function bindBaiGraf(){if(!$('bgraf'))return;
  document.querySelectorAll('[data-bper]').forEach(b=>b.onclick=()=>{ui.baiPer=b.dataset.bper;render()});
  document.querySelectorAll('[data-bnav]').forEach(b=>b.onclick=()=>{const ref=ui.baiRef||hoje(),k=+b.dataset.bnav;
    if(ui.baiPer==='mes'){const d=dObj(ref.slice(0,8)+'01');d.setMonth(d.getMonth()+k);ui.baiRef=dStr(d)}else ui.baiRef=addDias(ref,7*k);

  return{n,ok,pct:s>0?Math.max(0,100*(1-e/s)):(n?(ok===n?100:0):null),falta:f,soma:s,e}}

const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const deb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function chaveDe(senha,salt,iter,uso){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[uso])}
async function cifra(txt,senha){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;const k=await chaveDe(senha,salt,iter,'encrypt');const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));
  return JSON.stringify({app:'INVENTRA',formato:'inventra-cripto-1',kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),dados:b64(ct)})}
async function decifra(json,senha){const o=JSON.parse(json);if(o.formato!=='inventra-cripto-1')throw new Error('formato');const k=await chaveDe(senha,deb64(o.salt),o.iter,'decrypt');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:deb64(o.iv)},k,deb64(o.dados));return new TextDecoder().decode(pt)}

function instalaLog(){if(sb._logOk)return;sb._logOk=true;const orig=sb.from.bind(sb);
  const grava=(acao,p,id,res)=>{try{if(!uid)return;const a=Array.isArray(p)?p[0]:p,r=ocs.find(x=>String(x.id)===String(id))||{},d=(res&&(Array.isArray(res)?res[0]:res))||{};

    let ex='';if(acao==='editou'&&a){const k=Object.keys(a);ex=a.gar_status?' · situação: '+a.gar_status:k.includes('dados')&&k.length===1?' · impressão registrada':k.length===1&&k[0]==='hist'?' · anotação':''}

    orig('atividade').insert({acao,categoria:cat,ref_id:String(id||d.id||''),resumo:(n||'registro')+ex}).then(()=>{atv=null},()=>{})}catch(e){}};

function atobSeguro(k){try{return atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))}catch(e){return''}}
function telaConfig(){document.body.classList.add('auth');
  $('view').innerHTML=`<div class="stack">

   <li>Em <b>Project Settings</b> → <b>API Keys</b>, copie a chave <b>anon public</b> (aba Legacy) ou a <b>Publishable key</b>. Em <b>Project Settings</b> → <b>Data API</b>, copie a <b>Project URL</b>. Cole as duas abaixo.</li>
  </ol></div>
  <form class="box stack" id="fcfg" novalidate>
   <div class="field"><label class="lbl" for="cfgUrl">Project URL</label><input id="cfgUrl" class="mono" placeholder="https://xxxx.supabase.co"></div>

   <p class="muted small" style="margin:0">O arquivo baixado já vem com a conexão pronta. Use esse arquivo daqui em diante e copie-o para os outros computadores. <b>A primeira pessoa que se cadastrar vira administrador</b>, então faça o seu cadastro primeiro.</p>

  $('copiarSql').onclick=()=>{const t=$('sql').textContent.trim();const box=$('sqlBox');
    const fb=()=>{box.value=t;box.hidden=false;box.select();toast('Selecione o texto e copie com Ctrl+C')};
    try{navigator.clipboard.writeText(t).then(()=>{$('sqlOk').hidden=false},fb)}catch(e){fb()}};
  let cfg=null;
  if(window.top!==window){$('view').insertAdjacentHTML('afterbegin','<div class="box err" style="margin-bottom:14px">Este arquivo está aberto dentro de outro aplicativo, e assim a conexão não funciona. Baixe o arquivo inventario-cd.html, abra a pasta Downloads e dê dois cliques nele para abrir no Chrome ou no Edge.</div>')}
  $('fcfg').addEventListener('submit',async e=>{e.preventDefault();const m=$('cfgMsg'),btn=e.target.querySelector('[type=submit]');

    if(url&&!/^https?:\/\//.test(url))url='https://'+url;

    const show=(ok,t)=>{m.className=ok?'ok':'err';m.textContent=t;m.hidden=false;m.scrollIntoView({block:'center',behavior:'smooth'})};
    if(!/^https:\/\/[^/]+\.[a-z]+/.test(url)){show(false,'A Project URL parece errada. Ela tem o formato https://xxxx.supabase.co e fica em Project Settings → Data API.');return}

    clearTimeout(timer);btn.disabled=false});
  const baixa=(nomeArq,txt,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nomeArq;document.body.appendChild(a);a.click();a.remove()};

    toast('Arquivo baixado. Abra o inventario-cd.html da pasta Downloads.')};
}

  if(scanAtivo)fechaScanner();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este aparelho não permite usar a câmera aqui.');return}
  const ov=document.createElement('div');ov.id='scanOv';ov.className='scanov';ov.innerHTML='<div class="scanbox"><video id="scanVid" playsinline muted></video><div class="scanline"></div><div class="scanmsg" id="scanMsg">Aponte a câmera para o código de barras</div><button type="button" class="btn" id="scanX">Fechar</button></div>';
  document.body.appendChild(ov);const S=scanAtivo={parou:false};$('scanX').onclick=fechaScanner;ov.addEventListener('click',e=>{if(e.target===ov)fechaScanner()});
  const achou=v=>{if(S.parou||!v)return;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}fechaScanner();cb(String(v).trim())};
  const msg=m=>{const e=$('scanMsg');if(e)e.textContent=m};
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(S.parou){stream.getTracks().forEach(t=>t.stop());return}
    S.stream=stream;const vid=$('scanVid');vid.srcObject=stream;await vid.play().catch(()=>{});
    if('BarcodeDetector' in window){
      let det;try{det=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code']})}catch(e){det=new BarcodeDetector()}
      const loop=async()=>{if(S.parou)return;try{const r=await det.detect(vid);if(r&&r.length){achou(r[0].rawValue);return}}catch(e){}setTimeout(loop,150)};loop()
    }else{
      msg('Preparando leitor…');await carregaZxing();if(S.parou)return;msg('Aponte a câmera para o código de barras');
      const rd=new ZXingBrowser.BrowserMultiFormatReader();
      S.ctl=await rd.decodeFromVideoElement(vid,(r,err,c)=>{if(r)achou(r.getText())});
    }
  }catch(e){fechaScanner();toast(e&&e.name==='NotAllowedError'?'Permita o acesso à câmera para ler o código.':'Não foi possível abrir a câmera.')}}
{const gc=document.getElementById('gscam');if(gc)gc.innerHTML=IC_CAM}
const SCAN_IDS=/^(sku|msku|avsku|bs\d+)$/;
function poeBotoesScan(){document.querySelectorAll('#view input').forEach(el=>{if(!SCAN_IDS.test(el.id||'')||el.dataset.scan)return;el.dataset.scan='1';
  const b=document.createElement('button');b.type='button';b.className='scanbtn';b.title='Ler código de barras com a câmera';b.setAttribute('aria-label','Ler código de barras com a câmera');b.innerHTML=IC_CAM;
  const w=document.createElement('div');w.className='scanwrap';el.parentNode.insertBefore(w,el);w.appendChild(el);w.appendChild(b);
  b.onclick=()=>abreScanner(v=>{el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));toast('Código lido: '+v)})})}
new MutationObserver(()=>poeBotoesScan()).observe(document.getElementById('view'),{childList:true,subtree:true});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#gscam');if(b){abreScanner(v=>{const c=v.replace(/^0+(?=\d)/,'').toUpperCase();$('gsq').value=c;abrePeca(c)})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&scanAtivo)fechaScanner()});

const ultAuto={};
document.addEventListener('input',e=>{
  const el=e.target,id=el.id||'';let dest=null;
  if(id==='sku')dest='produto';else if(id==='msku')dest='mdesc';else if(/^bs\d+$/.test(id))dest='bp'+id.slice(2);else if(id==='avsku')dest='avdesc';
  if(!dest||!window.PRODUTOS)return;
  const alvo=document.getElementById(dest);if(!alvo)return;
  const nome=window.PRODUTOS[el.value.trim().replace(/^0+(?=\d)/,'')]||window.PRODUTOS[el.value.trim()];
  if(nome){if(!alvo.value||alvo.dataset.auto==='1'||alvo.value===ultAuto[dest]){alvo.value=nome;ultAuto[dest]=nome;alvo.dataset.auto='1';alvo.dispatchEvent(new Event('input',{bubbles:true}))}}
  else if(alvo.dataset.auto==='1'||(alvo.value&&alvo.value===ultAuto[dest])){alvo.value='';alvo.dataset.auto='';alvo.dispatchEvent(new Event('input',{bubbles:true}))}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.auto==='1'&&e.isTrusted)e.target.dataset.auto=''},true);

</script>
